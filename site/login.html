<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Fontawesome CSS-->
    <script src="https://kit.fontawesome.com/b7eda554a4.js" crossorigin="anonymous"></script>
    <!-- Main CSS -->
    <link rel="stylesheet" type="text/css" href="css/login-style.css">
    <!-- Responsiveness CSS -->
    <link rel="stylesheet" type="text/css" href="css/login-responsiveness.css">
</head>
<body>
    <!-- Background Container -->
    <div class="background">
    </div>
    <!-- Login Form -->
    <form action="/login.html" method="GET">
          <h1>Welcome</h1>
          <p>We can't wait to celebrate with you! <br> Use the invite password below for more details.</p>
          <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Password" required />
            <input type="submit" value="Login" />
        </div>
    </form>
</body>
</html>
