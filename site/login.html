<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Fontawesome CSS-->
    <script src="https://kit.fontawesome.com/b7eda554a4.js" crossorigin="anonymous"></script>
    <!-- Main CSS -->
    <link rel="stylesheet" type="text/css" href="css/login-style.css">
    <!-- Responsiveness CSS -->
    <link rel="stylesheet" type="text/css" href="css/login-responsiveness.css">
    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
</head>
<body>
    <!-- Background Container -->
    <div class="background">
    </div>
    <!-- Login Form -->
    <form action="/login.html" method="GET">
          <h1>Chloe & Nathan</h1>
          <p>
            We hope you are as excited as we are to celebrate together
            <br><br>
            Please enter the password on your invitation to access everything you need to know about our special day
         </p>
          <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Password" required />
            <input type="submit" value="Login" />
        </div>
    </form>
</body>
</html>
