name: CI Security

on:
  push:
    branches: [main]

jobs:
  Checkov-Security-Scan:
    name: Run Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov with GitHub Action
        uses: bridgecrewio/checkov-action@cc0e17d456ef1713bbfd963ebac19dc776775cb2 # v12.3128.0
        with:
          directory: ./terraform
          quiet: true
