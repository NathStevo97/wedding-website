name: CI Security

on:
  push:
    branches: [main]

jobs:
  Checkov-Security-Scan:
    name: Run Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov with GitHub Action
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.3114.0
        with:
          directory: ./infra
          quiet: true
